<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110" role="img" aria-label="Liga Unitel Girabola">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2762B"/>
      <stop offset="1" stop-color="#C1361A"/>
    </linearGradient>
  </defs>

  <!-- Escudo laranja (vetorial, nunca preto) -->
  <path fill="url(#shield)"
        d="M16 6 L84 6 Q92 6 92 16 L92 56 Q92 80 50 102 Q8 80 8 56 L8 16 Q8 6 16 6 Z"/>

  <!-- Palanca negra gigante — silhueta em negativo (branco) -->
  <g fill="#FFFFFF">
    <!-- Chifres longos e curvos (anelados), recuados sobre o dorso -->
    <path d="M55 24
             C 50 16, 42 12, 33 13
             C 41 16, 46 21, 49 28
             C 45 24, 39 22, 33 24
             C 41 26, 46 30, 49 36
             L 53 33
             Z"/>
    <path d="M62 24
             C 58 15, 50 10, 40 11
             C 49 14, 55 19, 58 27
             C 53 23, 47 21, 41 23
             C 49 26, 55 31, 58 38
             L 63 34
             Z"/>
    <!-- Cabeça e pescoço, focinho virado para baixo/direita -->
    <path d="M55 30
             C 63 33, 67 41, 67 50
             C 67 58, 64 66, 58 72
             C 60 64, 60 56, 57 50
             C 54 60, 49 68, 41 73
             C 47 64, 50 55, 50 47
             C 50 40, 51 34, 55 30 Z"/>
  </g>
</svg>
